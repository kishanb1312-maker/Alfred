# WarmApply · example search config
# Copy to config/search.yaml and edit. The Job Finder falls back to THIS file
# (with a warning) when config/search.yaml is missing.

roles:
  - Site Reliability Engineer
  - DevOps Engineer
  - Platform Engineer

locations:
  - Remote (India)
  - Bengaluru

seniority: mid

sources:
  - linkedin_easy_apply
  - adzuna

# The order sources are searched each run. ALL implemented sources are searched EVERY run —
# this list only sets the sequence and decides which source "wins" a duplicate (first one wins).
# It does NOT cap how many jobs are found. Daily caps limit APPLYING, not finding.
# Sources not yet implemented are skipped. (search_order takes precedence over `sources:`.)
search_order:
  - linkedin_easy_apply     # 1
  - linkedin_feed           # 2 — "we're hiring" posts (recent + location filtered)  [not built yet]
  - indeed                  # 3 — browser (India volume)                             [not built yet]
  - we_work_remotely        # 4 — RSS                                                [not built yet]
  - wellfound               # 5 — browser                                            [not built yet]
  - adzuna                  # 6 — API (broad aggregator)
  - remoteok                # 7 — API  ◄ built in this task
  - jobspresso              # 8 — RSS                                                [not built yet]
  - greenhouse_lever        # 9 — per-company JSON                                    [not built yet]

blacklist_companies:
  - Shady Recruiters LLC
  - Acme Corp

caps:
  applies_per_day: 10

match_threshold: 70

pacing:
  min_seconds_between_actions: 4
  max_seconds_between_actions: 9

dry_run: true
