# Alfred · example search config
# Copy to config/search.yaml and edit. The Job Finder falls back to THIS file
# (with a warning) when config/search.yaml is missing.

roles:
  - Site Reliability Engineer
  - DevOps Engineer
  - Platform Engineer

locations:
  - Remote (India)
  - Bengaluru

seniority: mid


# The order sources are searched each run. ALL implemented sources are searched EVERY run —
# this list only sets the sequence and decides which source "wins" a duplicate (first one wins).
# It does NOT cap how many jobs are found. Daily caps limit APPLYING, not finding.
# Sources not yet implemented are skipped. This is the ONE list that decides which sources run.
search_order:
  - linkedin_easy_apply     # 1
  - linkedin_feed           # 2 — "we're hiring" posts (recent + location filtered)  [not built yet]
  - indeed                  # 3 — browser (India volume)                             [not built yet]
  - we_work_remotely        # 4 — RSS                                                [not built yet]
  - wellfound               # 5 — browser                                            [not built yet]
  - remoteok                # 7 — API  ◄ built in this task
  - jobspresso              # 8 — RSS                                                [not built yet]
  - greenhouse_lever        # 9 — per-company JSON

# Specific company job boards to watch (Greenhouse / Lever). Empty by default —
# add companies you'd love to work at. `token` is the company slug in the board URL.
# Maximum age of a listing, in days. HARD filter applied to every source, browser and
# API alike: anything older is dropped before de-duping. Sources whose UI has a date
# filter are also narrowed to this window at the source. Keep it small (2-3) to see
# only genuinely new postings; raise it if a run comes back too thin.
max_age_days: 3

company_boards: []
  # - { provider: greenhouse, token: "airbnb",  name: "Airbnb" }
  # - { provider: lever,      token: "netflix", name: "Netflix" }

blacklist_companies:
  - Shady Recruiters LLC
  - Acme Corp

caps:
  applies_per_day: 10

match_threshold: 70

pacing:
  min_seconds_between_actions: 4
  max_seconds_between_actions: 9

dry_run: true
