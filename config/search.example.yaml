# Alfred · example search config
# Copy to config/search.yaml and edit. The Job Finder falls back to THIS file
# (with a warning) when config/search.yaml is missing.
#
# Which companies/boards the career-ops scanner reads, and its title/location
# filters, live in portals.yml (written at setup by `alfred careerops-onboard`).

roles:
  - Product Designer
  - UX Designer

locations:
  - Bengaluru, India
  - Remote

seniority:
  - mid
  - senior

# Where to look. worldwide = keep jobs in every country (nothing is dropped for its
# location); india = keep only India + remote. The review list is then ordered by
# location_priority, and the evaluator scores location the same way (modes/_profile.md).
location_scope: worldwide
location_priority:
  - remote_abroad     # remote jobs at companies outside India — first
  - india             # on-site / hybrid / remote in India
  - onsite_abroad     # on-site or hybrid outside India (needs visa sponsorship)

# Browser sources (LinkedIn, Indeed, Wellfound) and portal applying run through Aside,
# in your own signed-in browser. There is no other browser option.

# The order sources are searched each run. ALL implemented sources are searched EVERY run —
# this list only sets the sequence and decides which source "wins" a duplicate (first one wins).
# It does NOT cap how many jobs are found. Daily caps limit APPLYING, not finding.
search_order:
  - careerops_scan          # career-ops scan.mjs — 150+ ATS providers, zero AI tokens (portals.yml)
  - linkedin_feed           # Aside — "we're hiring" posts
  - linkedin_easy_apply     # Aside
  - indeed                  # Aside (in.indeed.com)
  - wellfound               # Aside
  - we_work_remotely        # RSS
  - remoteok                # API
  - jobspresso              # RSS
  - greenhouse_lever        # per-company JSON (company_boards below)

# Maximum age of a listing, in days. HARD filter on every source (also passed to the
# career-ops scanner as --since).
max_age_days: 3

company_boards: []
  # - { provider: greenhouse, token: "airbnb",  name: "Airbnb" }
  # - { provider: lever,      token: "netflix", name: "Netflix" }

blacklist_companies:
  - Shady Recruiters LLC

caps:
  applies_per_day: 10
  emails_per_day: 10

# career-ops 1-5 score. Jobs below this stay in the tracker as Evaluated but are not put
# on your review list. career-ops recommends not applying below 4.0.
min_score: 4.0

# Applying (application agent, through Aside).
#   auto_submit: true  -> after YOU approve a job, Aside fills the form and clicks Submit.
#   auto_submit: false -> Aside fills the form and stops on the review page for you.
# dry_run: true below still blocks every submit and send.
apply:
  auto_submit: true

# How a cleared cold email leaves.
#   smtp            -> sent immediately through Gmail SMTP (GMAIL_ADDRESS in .env)
#   gmail_schedule  -> Aside schedules it in Gmail ("Schedule send") for schedule_at, IST,
#                      with that job's own tailored CV attached. Aside must be signed in as account.
email:
  mode: gmail_schedule
  schedule_at: "11:00"
  account: "you@gmail.com"

pacing:
  min_gap_seconds: 45
  max_gap_seconds: 180

dry_run: true
